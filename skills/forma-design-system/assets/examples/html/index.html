<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forma — 案件の登録</title>
    <!-- Place alongside assets/forma, or adapt these URLs to the application's served asset root. -->
    <link rel="stylesheet" href="./assets/forma/forma.css" />
    <link rel="stylesheet" href="./assets/forma/fonts/fonts.css" />
    <style>
      body {
        margin: 0;
      }
      .page {
        min-height: 100vh;
        padding: 24px;
      }
      .content {
        max-width: 640px;
        margin: auto;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <main class="forma page" data-theme="light" data-density="comfortable" id="forma-root">
      <div class="content stack">
        <div class="f-field">
          <label for="theme">テーマ</label
          ><select id="theme" class="f-input">
            <option value="system">OS設定</option>
            <option value="light">ライト</option>
            <option value="dark">ダーク</option>
          </select>
        </div>
        <h1>案件の登録</h1>
        <p>名称と担当者を確認して登録します。この例ではブラウザ内だけで保存します。</p>
        <form id="project-form" class="stack" novalidate>
          <div class="f-field">
            <label for="name">案件名</label
            ><input
              class="f-input"
              id="name"
              name="name"
              required
              aria-describedby="name-error"
            /><span class="f-error" id="name-error" role="alert"></span>
          </div>
          <div class="f-field">
            <label for="owner">担当者</label
            ><select id="owner" name="owner" class="f-input">
              <option>田中</option>
              <option>佐藤</option>
            </select>
          </div>
          <div class="actions">
            <button class="f-button f-button--primary" type="submit">保存</button
            ><button class="f-button" id="show-details" type="button">保存内容を確認</button>
          </div>
          <p role="status" id="save-status"></p>
        </form>
        <dialog class="f-dialog" id="details" aria-labelledby="details-title">
          <div class="f-between">
            <h2 id="details-title">保存した案件</h2>
            <button class="f-button" type="button" id="close-details">閉じる</button>
          </div>
          <div class="f-dialog-content"><p id="saved-project">まだ登録されていません。</p></div>
        </dialog>
      </div>
    </main>
    <script type="module" src="./theme.mjs"></script>
    <script type="module">
      const form = document.getElementById('project-form');
      const name = document.getElementById('name');
      const dialog = document.getElementById('details');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const invalid = !name.value.trim();
        name.setAttribute('aria-invalid', String(invalid));
        document.getElementById('name-error').textContent = invalid
          ? '案件名を入力してください。'
          : '';
        if (invalid) {
          name.focus();
          return;
        }
        document.getElementById('saved-project').textContent =
          `${name.value.trim()} / ${document.getElementById('owner').value}`;
        document.getElementById('save-status').textContent = '変更を保存しました';
      });
      document.getElementById('show-details').addEventListener('click', () => {
        dialog.inert = false;
        dialog.showModal();
      });
      document.getElementById('close-details').addEventListener('click', () => dialog.close());
      dialog.addEventListener('close', () => {
        if (!dialog.open) dialog.inert = true;
      });
    </script>
  </body>
</html>
